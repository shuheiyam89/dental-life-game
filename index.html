    var pct = progress(state);
    var career = state.career ? CAREERS[state.career].name + (state.flags.passed || state.career === 'da' ? '' : 'をめざす') : '進路未定';
    if (ev.stage >= 7 || (state.career === 'da' && ev.stage >= 6)) career = state.career ? CAREERS[state.career].name : career;
    return '<header class="game-header"><div class="wrap">' +
      '<div class="header-row">' +
      '<button class="icon-btn" data-action="back"' + (state.history.length ? '' : ' disabled') + ' aria-label="前の選択に戻る">← 戻る</button>' +
      '<div class="stage-label"><small>STEP ' + ev.stage + ' / 12</small>' + esc(STAGES[ev.stage]) + '</div>' +
      '<div class="hdr-right">' + soundButton() + '<button class="icon-btn" data-action="confirm-restart" aria-label="最初からやり直す">↺ 最初から</button></div>' +
      '</div>' +
      '<div class="status-row">' +
      '<div class="age-badge" aria-label="現在の年齢 ' + age + '歳"><b>' + age + '</b><span>歳</span></div>' +
      '<div class="progress-box"><div class="progress-top"><span class="career-chip">' + esc(career) + '</span><span class="money-chip" title="貯金 / 借金">💰' + esc(yen(state.money)) + (state.debt > 0 ? '<em>借' + esc(yen(state.debt)) + '</em>' : '') + '</span><span class="pct">' + pct + '%</span></div>' +
      '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div></div>' +
      '</div></div></header>';
  }

  /* ---------------- 物語の場面（イベント） ----------------
     1つのイベント = 「選ぶ前のコマ（intro）」→「選択肢」→「選んだ後のコマ（react）」 */
  var ui = { phase: 'intro', idx: 0, beats: [], typing: null, startAtEnd: false };
  var TYPE_SPEED = 28;
  var REACT_FACE = { exam: null, retake: 'smile+raise:hop' };

  function prevStageOf(s) { return s.log.length ? s.log[s.log.length - 1].stage : 0; }
  function castName(id) { return id === 'me' ? (state.life ? state.life.name : 'あなた') : (CAST[id] ? CAST[id].name : ''); }

  function defaultBg(s, ev) {
    var work = { dh: 'clinic', dds: 'clinic', dt: 'lab', da: 'reception' }[s.career] || 'clinic';
    var map = {
      exam: 'exam_hall', retake: 'home@night', retake2: 'home@night', dds_resident: 'clinic', hs_baito: 'city@evening', entrance: 'exam_hall', ronin: 'home@night', w_burnout: 'home@night',
      job_posting: 'city', job_salary: 'city', job_education: 'city@evening', job_visit: work,
      job_commute: 'city@evening', job_field: 'home@night', job_decide: 'home@evening',
      w_life: 'park', w_family: 'park@evening', w_change: 'city@evening', w_future: 'city@night'
    };
    if (map[ev.id]) return map[ev.id];
    if (ev.stage <= 4) return 'classroom';
    if (ev.stage === 5) return { dh: 'practice', dds: 'practice', dt: 'lab', da: 'reception' }[s.career];
    return work;
  }
  function defaultFace(ev) {
    if (/mistake|retake|ronin|burnout/.test(ev.id)) return 'worry';
    if (ev.type === 'exam') return 'determined';
    if (ev.stage === 6 || /cert|change|future|life/.test(ev.id)) return 'normal+think';
    return 'normal';
  }
  var PRIVATE = { job_field: 1, w_life: 1, w_family: 1, w_future: 1, retake: 1, retake2: 1, ronin: 1, w_burnout: 1 };

  /* 場面に合った曲を選ぶ */
  function bgmFor(b, ev) {
    if (b.bgm) return b.bgm;
    if (b.prologue) return 'prologue';
    if (ev.type === 'exam' && ui.phase === 'react') return state.flags.passed ? 'ending' : 'sad';
    if (ev.type === 'retake' && ui.phase === 'react') return state.flags.failed2 ? 'sad' : 'ending';
    if (ev.type === 'entrance' && ui.phase === 'react' && !b.bgm) return state.flags.ronin ? 'sad' : 'ceremony';
    if (ev.type === 'workplace' && ui.phase === 'react' && state.flags.rejected && b.final) return 'sad';
    if (ev.type === 'exam' || ev.type === 'entrance' || (ev.id === 'w_mistake' && ui.phase === 'intro')) return 'tension';
    if (ev.type === 'ronin' || ev.type === 'retake2' || ev.type === 'burnout') return ui.phase === 'react' ? 'daily' : 'night';
    var p = String(b.bg).split('@'), name = p[0], time = p[1] || 'day';
    if (name === 'ceremony') return 'ceremony';
    if (name === 'exam_hall') return 'tension';
    if (time === 'night') return 'night';
    if (/clinic|practice|reception|lab/.test(name)) return 'clinic';
    if (/classroom|school_gate|opencampus/.test(name)) return 'school';
    if (name === 'city') return 'city';
    return 'daily';
  }

  function filterBeats(list, s) { return (list || []).filter(function (b) { return !b.if || b.if(s); }); }

  function prologueBeats(s) {
    var town = findOrigin(ORIGIN_TOWNS, s.life.town), fam = findOrigin(ORIGIN_FAMILIES, s.life.family);
    return [
      { bg: town.bg + '@evening', prologue: true, t: '世界には、80億を超える人がいる。そのひとりひとりに、たったひとつの人生がある。' },
      { prologue: true, t: 'あなたが生まれたのは、' + town.text + '。' },
      { bg: findWealth(s.life.wealth).bg, prologue: true, familyCard: true, t: '「' + findWealth(s.life.wealth).label + '」に生まれた。' + findWealth(s.life.wealth).life },
      { prologue: true, t: fam.text },
      { bg: town.bg, me: 'smile:hop', prologue: true, t: 'そして、15歳の春――。これが、今回のあなたの人生。' }
    ];
  }

  function introBeats(s, ev) {
    var out = [];
    if (!s.history.length) out = out.concat(prologueBeats(s));
    var st = STORY[ev.id];
    var main = st ? filterBeats(st.intro, s) : [{ bg: defaultBg(s, ev), outfit: PRIVATE[ev.id] ? 'casual' : undefined, me: defaultFace(ev), t: evText(ev, s) }];
    if (ev.stage !== prevStageOf(s)) {
      var ch = chapterFor(s, ev), grow = growthLine(s, ev);
      var firstBg = (main[0] && main[0].bg) || defaultBg(s, ev);
      if (ch) out.push({ bg: firstBg, chapter: ch, cast: {}, t: '' });
      if (grow) out.push({ bg: firstBg, me: 'smile', t: grow });
    }
    return out.concat(main);
  }

  function reactBeats(s, ev, ci) {
    var st = STORY[ev.id];
    var list = st && st.react ? filterBeats(st.react[ci], s) : [];
    if (!list.length) {
      var face = ev.type === 'exam' ? (s.flags.failed && !s.flags.passed ? 'sad:slump' : 'smile+raise:hop') : (REACT_FACE[ev.type] || 'smile:nod');
      list = [{ me: face }];
    }
    list = list.concat(st ? filterBeats(st.after, s) : []);
    return list.concat([{ final: true, t: s.pending.result }]);
  }

  /* 書いていない項目は前のコマから引き継ぐ */
  function resolveBeats(list, s, ev, from) {
    var cur = from ? JSON.parse(JSON.stringify(from)) : { bg: defaultBg(s, ev), outfit: null, cast: {} };
    return list.map(function (b) {
      var r = { bg: b.bg || cur.bg, outfit: b.outfit !== undefined ? b.outfit : cur.outfit, cast: b.cast ? {} : Object.assign({}, cur.cast), who: b.who || null, t: b.t || '', chapter: b.chapter || null, final: !!b.final, prologue: !!b.prologue, familyCard: !!b.familyCard, bgm: b.bgm || null };
      Object.keys(b).forEach(function (k) {
        if (k !== 'me' && !CAST[k]) return;
        if (b[k] === null) { delete r.cast[k]; return; }
        var m = String(b[k]).split(':'), fp = m[0].split('+');
        r.cast[k] = { face: fp[0] || 'normal', pose: fp[1] || 'idle', anim: m[1] || '' };
      });
      if (!r.chapter && !r.prologue && !r.cast.me) r.cast.me = { face: 'normal', pose: 'idle', anim: '' };
      cur = { bg: r.bg, outfit: r.outfit, cast: JSON.parse(JSON.stringify(r.cast)) };
      Object.keys(cur.cast).forEach(function (k) { cur.cast[k].anim = ''; });
      return r;
    });
  }

  function prepareBeats() {
    var ev = currentEvent(state);
    if (state.pending) {
      var intro = resolveBeats(introBeats(state, ev), state, ev);
      ui.phase = 'react';
      ui.beats = resolveBeats(reactBeats(state, ev, state.pending.ci), state, ev, intro[intro.length - 1]);
      ui.idx = 0;
    } else {
      ui.phase = 'intro';
      ui.beats = resolveBeats(introBeats(state, ev), state, ev);
      ui.idx = ui.startAtEnd ? ui.beats.length - 1 : 0;
    }
    ui.instant = ui.startAtEnd;
    ui.startAtEnd = false;
  }

  /* 主人公：26歳を過ぎると、少し大人っぽい髪型に変わる */
  var MATURE = { pony: 'bun', spiky: 'short', long: 'bob', bob: 'bob', short: 'short', bun: 'bun' };
  function meSprite(outfit, face, pose, age) {
    var look = state.life.look;
    if (age >= 26) look = Object.assign({}, look, { hair: MATURE[look.hair] || look.hair });
    return PX.character(look, outfit, face, pose || 'idle', bodyFor(age));
  }
  function workOutfit() { return { dh: 'scrubs', dds: 'whitecoat', dt: 'apron', da: 'reception' }[state.career]; }
  function workBg() { return { dh: 'clinic', dds: 'clinic', dt: 'lab', da: 'reception' }[state.career]; }
  function albumFrames() {
    var ja = jobAge(state), schoolOutfit = { dh: 'dh_student', dds: 'dds_student', dt: 'dt_student', da: 'reception' }[state.career];
    var schoolBg = { dh: 'practice', dds: 'practice', dt: 'lab', da: 'reception' }[state.career];
    var mid = ja > 18 ? ja : 24;
    return [
      { age: 15, cap: '高校入学', bg: 'school_gate', img: meSprite('uniform', 'smile', 'idle', 15) },
      { age: 18 + (state.preShift || 0), cap: state.career === 'da' ? '働き始める' : CAREERS[state.career].school, bg: schoolBg, img: meSprite(schoolOutfit, 'determined', 'idle', 18) },
      { age: mid, cap: ja > 18 ? '就職' : '仕事に慣れる', bg: workBg(), img: meSprite(workOutfit(), 'smile', 'idle', mid) },
      { age: 30, cap: '30歳の今', bg: 'city@evening', img: meSprite(workOutfit(), 'smile', 'raise', 30) }
    ];
  }

  function spriteFor(id, c, beat, age) {
    var ev = currentEvent(state);
    if (id === 'me') return meSprite(beat.outfit || outfitFor(state, ev), c.face, c.pose, age);
    var n = CAST[id];
    var outfit = n.outfit === 'auto-friend' ? (age < 18 ? 'uniform' : 'casual') : n.outfit;
    var body = n.age === 'me' ? bodyFor(age) : n.age;
    return PX.character(n.look, outfit, c.face, c.pose, body);
  }

  function eventView() {
    return headerView() +
      '<main class="scene choosing"><div class="wrap">' +
      '<div class="stage" id="stage" aria-hidden="true"><div class="chapter-card" id="chapter"></div></div>' +
      '<div class="dialog-wrap">' +
      /* 名前の札はボタンの外に置く（スマホのブラウザはボタンからはみ出した部分を表示しないため） */
      '<span class="nameplate" id="nameplate" aria-hidden="true"></span>' +
      '<button class="dialog" id="dialog" data-action="advance" aria-label="会話を進める">' +
      '<span class="line" id="line" aria-live="polite"></span><span class="cue" id="cue">▼</span></button>' +
      '<div class="dialog-tools" id="tools"></div>' +
      '</div>' +
      '<div id="panel"></div>' +
      '</div></main>';
  }

  function showBeat(instant) {
    var b = ui.beats[ui.idx];
    if (!b) return;
    var age = currentAge(state);
    var stage = document.getElementById('stage');
    stage.style.backgroundImage = 'url(' + PX.background(b.bg) + ')';

    /* 登場人物 */
    var ids = Object.keys(b.cast);
    var others = ids.filter(function (k) { return k !== 'me'; });
    Array.prototype.slice.call(stage.querySelectorAll('.chara')).forEach(function (el) {
      if (ids.indexOf(el.getAttribute('data-id')) < 0) el.remove();
    });
    ids.forEach(function (id) {
      var c = b.cast[id];
      var el = stage.querySelector('.chara[data-id="' + id + '"]');
      if (!el) {
        el = document.createElement('img');
        el.className = 'chara enter';
        el.setAttribute('data-id', id);
        el.alt = '';
        stage.appendChild(el);
      }
      var src = spriteFor(id, c, b, age);
      if (el.getAttribute('src') !== src) el.setAttribute('src', src);
      var pos = id === 'me' ? 'pos-me' : others.length > 1 ? (others.indexOf(id) === 0 ? 'pos-r1' : 'pos-r2') : 'pos-r';
      el.classList.remove('pos-me', 'pos-r', 'pos-r1', 'pos-r2', 'flip', 'listen');
      el.classList.add(pos);
      if (id !== 'me') el.classList.add('flip');
      if (b.who && b.who !== id) el.classList.add('listen');
      el.classList.remove('a-hop', 'a-shake', 'a-nod', 'a-slump');
      if (c.anim) { void el.offsetWidth; el.classList.add('a-' + c.anim); }
    });

    /* 章タイトル */
    var chap = document.getElementById('chapter');
    if (b.chapter) { chap.innerHTML = '<small>' + esc(b.chapter.no) + '</small>' + esc(b.chapter.title); chap.classList.add('show'); }
    else chap.classList.remove('show');
    stage.classList.toggle('is-chapter', !!b.chapter);

    /* 会話 */
    var plate = document.getElementById('nameplate');
    plate.textContent = b.who ? castName(b.who) : '';
    plate.style.display = b.who ? '' : 'none';
    var line = document.getElementById('line');
    line.classList.toggle('narration', !b.who);
    var text = b.chapter ? '― ' + b.chapter.no + '　' + b.chapter.title + ' ―' : nm(b.t);
    BGM.play(bgmFor(b, currentEvent(state)));

    var last = ui.idx === ui.beats.length - 1;
    document.getElementById('panel').innerHTML = '';
    toolsView(last);
    typeText(line, text, instant, function () { afterTyped(last); });
  }

  function typeText(el, text, instant, done) {
    clearInterval(ui.typing);
    ui.typing = null;
    if (instant || !text) { el.textContent = text; done(); return; }
    var i = 0;
    el.textContent = '';
    ui.typing = setInterval(function () {
      i += 1;
      el.textContent = text.slice(0, i);
      if (i >= text.length) { clearInterval(ui.typing); ui.typing = null; done(); }
    }, TYPE_SPEED);
    ui.typingText = text;
    ui.typingDone = done;
    ui.typingEl = el;
  }
  function finishTyping() {
    if (!ui.typing) return false;
    clearInterval(ui.typing);
    ui.typing = null;
    ui.typingEl.textContent = ui.typingText;
    ui.typingDone();
    return true;
  }

  function toolsView(last) {
    var b = ui.beats[ui.idx];
    var html = '';
    if (b.prologue) html += '<button class="tool-btn" data-action="reroll">🎲 別の人生に生まれ直す</button>';
    if (!last) html += '<button class="tool-btn" data-action="skip">スキップ ▶▶</button>';
    document.getElementById('tools').innerHTML = html;
  }

  function afterTyped(last) {
    var cue = document.getElementById('cue');
    if (cue) cue.style.visibility = last ? 'hidden' : 'visible';
    if (ui.beats[ui.idx] && ui.beats[ui.idx].familyCard) { document.getElementById('panel').innerHTML = familyPanel(); return; }
    if (!last) return;
    var panel = document.getElementById('panel');
    if (ui.phase === 'intro') panel.innerHTML = choicePanel();
    else panel.innerHTML = outcomePanel();
    if (ui.phase === 'react' && currentEvent(state).type === 'exam' && state.flags.passed) BGM.sfx('pass');
    /* 選択肢までが1画面に収まるよう、いちばん上から表示（収まらない端末では選択肢が見える位置へ） */
    window.scrollTo(0, 0);
    var rect = panel.getBoundingClientRect();
    if (rect.bottom > window.innerHeight) window.scrollBy(0, rect.bottom - window.innerHeight + 12);
  }

  /* 生まれた家庭の紹介カード */
  function familyPanel() {
    var L = state.life, w = findWealth(L.wealth), town = findOrigin(ORIGIN_TOWNS, L.town);
    var sup = Math.round(supportRate(state) * 100);
    var rank = { dental: 6, rich: 5, upper: 4, middle: 3, tight: 2, poor: 1 }[w.id];
    var meter = '';
    for (var i = 1; i <= 6; i++) meter += '<i class="' + (i <= rank ? 'on' : '') + '"></i>';
    return '<section class="family-card wealth-' + w.id + '" aria-label="生まれた家庭">' +
      '<div class="family-head"><span class="fc-kicker">あなたが生まれた家庭</span><b>' + esc(w.label) + '</b><span class="wealth-meter" aria-label="家計のゆとり ' + rank + '/6">' + meter + '</span></div>' +
      '<dl class="family-list">' +
      '<dt>生まれた町</dt><dd>' + esc(town.text) + '</dd>' +
      '<dt>家族</dt><dd>' + esc(L.parents) + '／' + esc(L.siblings) + '</dd>' +
      '<dt>世帯年収</dt><dd>' + esc(w.income) + '</dd>' +
      '<dt>最初の貯金</dt><dd><b>' + esc(yen(w.start)) + '</b></dd>' +
      '<dt>学費の援助</dt><dd>家族が学費の<b>約' + sup + '%</b>を出してくれる' + (sup < 50 ? '（残りは奨学金＝借金に）' : '') + '</dd>' +
      (w.gift ? '<dt>開業するとき</dt><dd>実家から最大 ' + esc(yen(w.gift)) + 'の援助が期待できる</dd>' : '') +
      '</dl></section>';
  }

  function choicePanel() {
    var ev = currentEvent(state);
    var choices = evChoices(ev, state);
    var terms = evTerms(ev, state);
    var html = '<section class="choice-panel" aria-label="選択肢">';
    html += '<h2 class="event-title"><span class="event-kicker">EVENT</span>' + esc(evTitle(ev, state)) + '</h2>';
    if (terms.length) html += '<details class="terms"><summary>💡 用語の説明（' + terms.map(function (t) { return esc(t.w); }).join('・') + '）</summary><dl>' + terms.map(function (t) { return '<dt>' + esc(t.w) + '</dt><dd>' + esc(t.d) + '</dd>'; }).join('') + '</dl></details>';
    html += '<ul class="choices' + (ev.type === 'career' ? ' career-list' : '') + '">';
    choices.forEach(function (c, i) {
      html += '<li><button class="choice' + (ev.type === 'career' ? ' career' : '') + '" data-action="choose" data-index="' + i + '">';
      if (ev.type === 'career') {
        var info = CAREERS[c.career];
        html += '<span class="career-head"><span class="letter">' + LETTERS[i] + '</span><span>' + esc(info.name) + '</span><span class="career-tag c-' + info.color + '">' + (info.license ? '国家資格' : '資格不要') + '</span></span>' +
          '<span class="career-info">' + esc(info.brief) + '</span>';
      } else {
        html += '<span class="letter">' + LETTERS[i] + '</span><span class="body">' + esc(c.t) + (c.d ? '<span class="desc">' + esc(c.d) + '</span>' : '') + '</span>';
      }
      html += '</button></li>';
    });
    return html + '</ul></section>';
  }

  function outcomePanel() {
    var ev = currentEvent(state), p = state.pending;
    var cls = 'outcome', stamp = '';
    var choice = evChoices(ev, state)[p.ci];
    if (ev.type === 'exam') {
      var passed = !!state.flags.passed;
      cls += passed ? ' pass' : ' fail';
      stamp = '<div class="result-stamp">' + (passed ? '🎉 合格' : '不合格 → 再挑戦へ') + '</div>';
    }
    if (ev.type === 'retake') { var ok = !state.flags.failed2; cls += ok ? ' pass' : ' fail'; stamp = '<div class="result-stamp">' + (ok ? '🎉 合格' : '不合格 → もう1年') + '</div>'; }
    if (ev.type === 'retake2') { cls += ' pass'; stamp = '<div class="result-stamp">🎉 合格</div>'; }
    if (ev.type === 'entrance') { var ok2 = !state.flags.ronin; cls += ok2 ? ' pass' : ' fail'; stamp = '<div class="result-stamp">' + (ok2 ? '🌸 合格' : '不合格 → 浪人へ') + '</div>'; }
    if (ev.type === 'workplace' && state.flags.rejected) { cls += ' fail'; stamp = '<div class="result-stamp">第一志望は不採用</div>'; }
    if (choice.open) { var ok3 = !!state.flags.independent; cls += ok3 ? ' pass' : ' fail'; stamp = '<div class="result-stamp">' + (ok3 ? '🎉 独立' : '資金不足で断念') + '</div>'; }
    var deltas = p.deltas.map(function (d) {
      return '<li class="' + (d.v < 0 ? 'down' : '') + '">' + esc(SHORT[d.key]) + ' ' + (d.v > 0 ? '+' + d.v : '−' + Math.abs(d.v)) + '</li>';
    }).join('');
    var money = [];
    if (p.money) money.push('<li class="money ' + (p.money < 0 ? 'down' : '') + '">貯金 ' + (p.money > 0 ? '+' : '') + esc(yen(p.money)) + '</li>');
    if (p.debt > 0) money.push('<li class="money down">借金 +' + esc(yen(p.debt)) + '</li>');
    if (p.income) money.push('<li class="money ' + (p.income < 0 ? 'down' : '') + '">年収 ' + (p.income > 0 ? '+' : '') + esc(yen(p.income)) + '</li>');
    deltas = money.join('') + deltas;
    var nextLabel = nextIndex(state, state.cursor) < 0 ? '30歳の誕生日を迎える' : '次へ進む';
    return '<section class="' + cls + '" id="outcome" aria-label="選択の結果">' +
      '<div class="outcome-label">あなたの選択：' + esc(choice.career ? CAREERS[choice.career].name + 'をめざす' : choice.t) + '</div>' + stamp +
      (deltas ? '<ul class="deltas" aria-label="変化した傾向">' + deltas + '</ul>' : '') +
      '<button class="btn block" data-action="next">' + nextLabel + ' →</button>' +
      '</section>';
  }

  function advance() {
    if (finishTyping()) return;
    if (ui.idx < ui.beats.length - 1) { ui.idx++; showBeat(); }
  }
  function skip() {
    finishTyping();
    ui.idx = ui.beats.length - 1;
    showBeat(true);
  }

  /* ---------------- エンディング ---------------- */
  function endingView() {
    var story = endingStory(state);
    return '<main class="ending"><div class="wrap"><section class="ending-card">' +
      '<div class="ending-age">STEP 9　30歳のエンディング<b>30歳</b></div>' +
      '<div class="stage ending-stage" style="background-image:url(' + PX.background(workBg() + '@evening') + ')" aria-hidden="true"><img class="chara pos-r a-hop" style="left:36%" src="' + meSprite(workOutfit(), 'smile', 'raise', 30) + '" alt=""></div>' +
      '<p class="ending-name">' + esc(state.life.name) + 'さんの30歳</p>' +
      '<h1 class="ending-title">' + esc(lifeTitle(state)) + '</h1>' +
      '<ul class="ending-story">' + story.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>' +
      '<button class="btn block" data-action="result">あなたの診断結果を見る</button>' +
      '<div style="margin-top:10px"><button class="icon-btn" data-action="back">← ひとつ前の選択に戻る</button></div>' +
      '</section></div></main>';
  }

  /* ---------------- 結果 ---------------- */
  function confetti() {
    var colors = ['#ffffff', '#ffe08a', '#bff0e6', '#cfe4fb'];
    var out = '';
    for (var i = 0; i < 22; i++) {
      var x = (i * 37) % 100, y = (i * 53) % 90;
      out += '<i style="left:' + x + '%;top:' + y + '%;background:' + colors[i % 4] + ';transform:rotate(' + (i * 29) + 'deg)"></i>';
    }
    return '<div class="confetti" aria-hidden="true">' + out + '</div>';
  }

  function radarSvg(radar) {
    var cx = 180, cy = 150, R = 100, n = radar.length;
    function pt(i, r) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / n;
      return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
    }
    var grid = '';
    [0.25, 0.5, 0.75, 1].forEach(function (k) {
      grid += '<polygon points="' + radar.map(function (_, i) { return pt(i, R * k).join(','); }).join(' ') + '" fill="none" stroke="#dde9e9" stroke-width="1"/>';
    });
    var axes = radar.map(function (_, i) { var p = pt(i, R); return '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0] + '" y2="' + p[1] + '" stroke="#dde9e9"/>'; }).join('');
    var shape = '<polygon points="' + radar.map(function (r, i) { return pt(i, R * r.value / 100).join(','); }).join(' ') + '" fill="rgba(47,183,163,.28)" stroke="#2fb7a3" stroke-width="2.5" stroke-linejoin="round"/>';
    var dots = radar.map(function (r, i) { var p = pt(i, R * r.value / 100); return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.5" fill="#1f8f80"/>'; }).join('');
    var labels = radar.map(function (r, i) {
      var p = pt(i, R + 22);
      var anchor = Math.abs(p[0] - cx) < 5 ? 'middle' : p[0] > cx ? 'start' : 'end';
      return '<text x="' + p[0] + '" y="' + (p[1] + 4) + '" text-anchor="' + anchor + '" font-size="14" font-weight="700" fill="#23383a">' + esc(SHORT[r.key]) + '</text>';
    }).join('');
    return '<svg class="radar" viewBox="-44 0 448 300" role="img" aria-label="あなたの傾向のレーダーチャート">' + grid + axes + shape + dots + labels + '</svg>';
  }

  function resultView() {
    var d = diagnose(state);
    var matches = matchClinics(state);
    var timeline = lifeTimeline(state);
    var path = careerPath(state);
    var t = d.main;
    var html = '<main class="result">';

    html += '<header class="result-hero">' + confetti() + '<div class="wrap">' +
      '<div class="hero-kicker">GAME CLEAR ・ 30歳</div>' +
      '<h1 class="hero-title">' + esc(state.life.name) + 'さんの歯科人生</h1>' +
      '<p class="hero-life">' + esc(lifeTitle(state)) + '</p>' +
      '</div></header>';

    html += '<div class="wrap">';
    html += '<section class="type-medal"><div class="icon" aria-hidden="true">' + t.icon + '</div>' +
      '<div class="label">あなたの仕事タイプ</div><h2>' + esc(t.name) + '</h2>' +
      '<p class="catch">' + esc(t.catch) + '</p>' +
      '<span class="subtype">サブの傾向：' + esc(d.sub.name) + '</span></section>';

    /* 0. 人生アルバム */
    html += '<section class="section"><div class="section-head"><span class="num">★</span><h3>人生アルバム</h3></div><ul class="album">' + albumFrames().map(function (a) {
      return '<li><div class="frame" style="background-image:url(' + PX.background(a.bg) + ')"><img src="' + a.img + '" alt="' + a.age + '歳のあなた"></div><b>' + a.age + '歳</b>' + esc(a.cap) + '</li>';
    }).join('') + '</ul></section>';

    /* お金の歩み */
    html += moneySection();

    /* 1. 振り返り */
    html += section(1, '15歳から30歳までの振り返り',
      '<ol class="timeline">' + timeline.map(function (l) {
        return '<li><span class="t-age">' + l.age + '歳</span><span class="t-body">' + esc(l.text) + '<small>' + esc(l.title) + '</small></span></li>';
      }).join('') + '<li><span class="t-age">30歳</span><span class="t-body"><b>' + esc(lifeTitle(state)) + '</b></span></li></ol>');

    /* 2. キャリアの変化 */
    html += section(2, '選択によって変化したキャリア',
      '<ol class="path">' + path.map(function (p, i) {
        return (i ? '<li aria-hidden="true"><span class="p-arrow">▼</span></li>' : '') +
          '<li><span class="p-dot">' + p.age + '歳</span><span class="p-text">' + esc(p.text) + '</span></li>';
      }).join('') + '</ol>');

    /* 3. 仕事タイプ */
    var reasons = d.reasons.map(function (r) { return '<li><b>' + r.age + '歳</b>' + esc(q(r.label)) + '</li>'; }).join('');
    var tend = d.tendencies.map(function (x) {
      return '<div class="tend"><div class="tend-label">● ' + esc(x.label) + 'が高め</div>' +
        (x.choices.length ? '<div class="tend-from">例：' + x.choices.map(function (c) { return esc(q(c)); }).join('') + '</div>' : '') + '</div>';
    }).join('');
    html += section(3, '仕事タイプの診断結果',
      '<p>' + esc(t.desc) + '</p>' +
      '<div class="sub-h">そのタイプになった理由</div>' +
      '<p style="font-size:15px">ゲーム中、特に次の選択で「' + esc(paramLabel(t.key)) + '」が大きく伸びました。</p>' +
      '<ul class="reason-list">' + reasons + '</ul>' +
      '<div class="sub-h">ゲーム中の選択から分かった傾向</div>' + tend +
      '<div class="sub-h">得意になりそうな働き方</div>' + list(t.style) +
      '<div class="sub-h">職場選びで確認するとよいポイント</div>' + list(t.check) +
      '<div class="sub-h">今後のキャリアへのアドバイス</div>' +
      '<div class="advice-box">' + esc(t.advice) + (d.growth ? '<br>また、「' + esc(d.growth.label) + '」を意識した経験を少し増やすと、さらに働き方の幅が広がりそうです。' : '') + '</div>');

    /* 4. 可視化 */
    var sortedBars = d.radar.slice().sort(function (a, b) { return b.value - a.value; });
    html += section(4, 'あなたの能力・価値観のバランス',
      '<div class="viz">' + radarSvg(d.radar) +
      '<ul class="bars">' + sortedBars.map(function (r, i) {
        return '<li class="' + (i < 3 ? 'top' : '') + '"><span>' + esc(SHORT[r.key]) + '</span><span class="bar"><i style="width:' + r.value + '%"></i></span></li>';
      }).join('') + '</ul></div>' +
      '<p class="viz-note">※あなたの中で一番強い傾向を100、一番控えめな傾向を20として表した、相対的なバランスです。</p>');

    /* 5. おすすめ医院 */
    html += section(5, 'あなたにおすすめの歯科医院',
      '<p style="font-size:14px;color:var(--ink-soft)">ゲーム中の選択と医院の特徴を照らし合わせて選びました。<b>すべてデモ用の架空の医院・求人です。</b></p>' +
      matches.map(clinicCard).join(''));

    html += '<div class="disclaimer">この診断は、ゲームの中の選択をもとにした<b>参考診断</b>です。医学的・心理学的な性格診断や、採用の適性検査ではありません。相性の目安は、ゲーム内の選択と架空の医院データから計算したもので、実際の採用や就職のしやすさを示すものではありません。</div>';

    html += '<div class="result-actions"><button class="btn block" data-action="restart">もう一度プレイする</button></div>';
    html += '</div></main>';
    return html;
  }

  function moneySection() {
    var rows = state.moneyLog.filter(function (r) { return r.age <= 30; });
    var W = 340, H = 150, L = 40, B = 22, T = 10;
    var max = Math.max(100, Math.max.apply(null, rows.map(function (r) { return Math.max(r.money, r.debt); })));
    var step = max > 3000 ? 1000 : max > 1000 ? 500 : max > 400 ? 200 : 100;
    max = Math.ceil(max / step) * step;
    function x(a) { return L + (a - 15) / 15 * (W - L - 8); }
    function y(v) { return T + (1 - v / max) * (H - T - B); }
    var grid = '';
    for (var v = 0; v <= max; v += step) grid += '<line x1="' + L + '" x2="' + (W - 8) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#dde9e9"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="10" fill="#5b7072">' + (v >= 1000 ? (v / 1000) + '千' : v) + '</text>';
    [15, 18, 22, 26, 30].forEach(function (a) { grid += '<text x="' + x(a) + '" y="' + (H - 6) + '" text-anchor="' + (a === 30 ? 'end' : a === 15 ? 'start' : 'middle') + '" font-size="10" fill="#5b7072">' + a + '歳</text>'; });
    function path(k) { return rows.map(function (r, i) { return (i ? 'L' : 'M') + x(r.age).toFixed(1) + ' ' + y(r[k]).toFixed(1); }).join(' '); }
    var svg = '<svg class="money-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="15歳から30歳までの貯金と借金の推移">' + grid +
      '<path d="' + path('debt') + '" fill="none" stroke="#d9655b" stroke-width="2.5" stroke-dasharray="5 3"/>' +
      '<path d="' + path('money') + '" fill="none" stroke="#2fb7a3" stroke-width="3"/></svg>';
    var notes = state.moneyNotes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('');
    return '<section class="section"><div class="section-head"><span class="num">💰</span><h3>お金の歩み</h3></div>' +
      '<div class="money-stats"><div><small>30歳の貯金</small><b>' + esc(yen(state.money)) + '</b></div><div><small>借金の残り</small><b class="' + (state.debt ? 'neg' : '') + '">' + esc(yen(state.debt)) + '</b></div><div><small>年収</small><b>' + esc(yen(state.income)) + '</b></div></div>' +
      svg + '<div class="money-legend"><span class="m">― 貯金</span><span class="d">- - 借金（奨学金・ローン）</span></div>' +
      (notes ? '<div class="sub-h">大きなお金の出来事</div><ul class="check-list money-notes">' + notes + '</ul>' : '') +
      '<p class="viz-note">※金額はゲーム用のおおよその目安です。</p></section>';
  }

  function section(num, title, body) {
    return '<section class="section"><div class="section-head"><span class="num">' + num + '</span><h3>' + esc(title) + '</h3></div>' + body + '</section>';
  }
  function list(items) {
    return '<ul class="check-list">' + items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>';
  }
  function stars(n) {
    var s = '';
    for (var i = 0; i < 5; i++) s += i < n ? '★' : '<span class="off">★</span>';
    return s;
  }

  function clinicCard(m) {
    var c = m.clinic;
    return '<article class="clinic rank-' + m.rank + '">' +
      '<div class="clinic-top"><span class="rank">' + m.rank + '位</span><div>' +
      '<span class="demo-badge">デモ用の架空求人</span>' +
      '<h4 class="clinic-name">' + esc(c.name) + '</h4>' +
      '<p class="clinic-catch">' + esc(c.catch) + '</p></div></div>' +
      '<div class="match-meter"><span class="pct">' + m.pct + '<small>%</small></span><div class="meter-body">' +
      '<div class="stars" aria-label="相性 星' + m.stars + 'つ">' + stars(m.stars) + '</div>' +
      '<div class="meter-label">相性の目安（ゲーム内の選択から算出）</div></div></div>' +
      (m.points.length ? '<div class="sub-h" style="margin-top:4px">一致したポイント</div><ul class="points">' + m.points.map(function (p) {
        return '<li><span class="you"><b>あなた</b>' + esc(p.player) + (p.from ? '<span>' + esc(q(p.from)) + '</span>' : '') + '</span>' +
          '<span class="link" aria-hidden="true">⇔</span><span class="them"><b>医院の特徴</b>' + esc(p.clinic) + '</span></li>';
      }).join('') + '</ul>' : '') +
      '<div class="sub-h">おすすめ理由</div><p class="clinic-reason">' + esc(m.reason) + '</p>' +
      '<button class="btn ghost block small" data-action="clinic" data-id="' + c.id + '">医院の詳細を見る</button>' +
      '</article>';
  }

  /* ---------------- モーダル ---------------- */
  function openModal(html) {
    modalRoot.innerHTML = '<div class="modal-backdrop" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true">' + html + '</div></div>';
    var focus = modalRoot.querySelector('.close, .btn');
    if (focus) focus.focus();
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    modalRoot.innerHTML = '';
    document.body.style.overflow = '';
    if (lastModalTrigger && document.body.contains(lastModalTrigger)) lastModalTrigger.focus();
    lastModalTrigger = null;
  }

  function clinicDetail(id) {
    var c = CLINICS.filter(function (x) { return x.id === id; })[0];
    if (!c) return;
    var role = CAREERS[state.career || 'dh'].name;
    var m = matchClinics(state).filter(function (x) { return x.clinic.id === id; })[0];
    openModal(
      '<div class="modal-head"><div><span class="demo-badge">デモ用の架空求人</span><h2>' + esc(c.name) + '</h2><p class="area">📍 ' + esc(c.area) + '</p></div>' +
      '<button class="close" data-action="close-modal" aria-label="閉じる">✕</button></div>' +
      '<div class="demo-banner">この求人はゲーム用に作成した架空のデータです。実在の医院・求人ではありません。応募はできません。</div>' +
      (m ? '<p style="margin:0 0 8px"><b style="color:var(--mint-dark)">あなたとの相性の目安：' + m.pct + '%</b>（ゲーム内の選択から算出）</p>' : '') +
      '<p style="margin:0">' + esc(c.feature) + '</p>' +
      '<div class="sub-h">募集要項（デモ）</div>' +
      '<table class="spec"><tbody>' +
      '<tr><th>募集職種</th><td>' + esc(role) + '</td></tr>' +
      '<tr><th>給与</th><td>' + esc(c.conditions.salary) + '</td></tr>' +
      '<tr><th>勤務時間</th><td>' + esc(c.conditions.hours) + '</td></tr>' +
      '<tr><th>休日</th><td>' + esc(c.conditions.holiday) + '</td></tr>' +
      '<tr><th>待遇</th><td>' + esc(c.conditions.benefit) + '</td></tr>' +
      '</tbody></table>' +
      '<div class="sub-h">教育制度</div><p>' + esc(c.education) + '</p>' +
      '<div class="sub-h">職場環境</div><p>' + esc(c.environment) + '</p>' +
      '<div class="sub-h">こんな人と相性がよい医院です</div>' + list(c.goodFor) +
      '<div class="modal-actions"><button class="btn block" data-action="close-modal">結果画面に戻る</button></div>'
    );
  }

  function confirmRestart() {
    openModal('<div class="confirm"><h2>最初からやり直しますか？</h2>' +
      '<p>ここまでの選択や結果はすべてリセットされます。</p>' +
      '<div class="modal-actions"><button class="btn block" data-action="restart">最初からやり直す</button>' +
      '<button class="btn ghost block" data-action="close-modal">ゲームを続ける</button></div></div>');
  }

  /* ---------------- ボタン操作 ---------------- */
  var busy = false;   // 連打による二重進行の防止
  document.addEventListener('click', function (e) {
    BGM.unlock();   /* ブラウザのルールで、最初の操作のあとから音が鳴ります */
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    if (action === 'sound') {
      BGM.toggle();
      Array.prototype.forEach.call(document.querySelectorAll('.sound-btn'), function (b) { b.outerHTML = soundButton(b.id); });
      return;
    }
    if (action === 'name-idea') {
      var input = document.getElementById('nick');
      input.value = NAME_IDEAS[Math.floor(Math.random() * NAME_IDEAS.length)];
      document.getElementById('nick-err').textContent = '';
      return;
    }

    if (action === 'close-modal') {
      if (el.classList.contains('modal-backdrop') && e.target !== el) return;  // モーダル内部のクリックは無視
      closeModal();
      return;
    }
    /* 会話送りは連打OK（二重進行しない作りのため） */
    if (action === 'advance') { advance(); return; }
    if (action === 'skip') { skip(); return; }
    if (el.disabled || busy) return;
    busy = true;
    try {
      switch (action) {
        case 'start':
          state = newState();
          state.screen = 'setup';
          render();
          break;
        case 'to-title':
          state = newState();
          render();
          break;
        case 'choose':
          el.classList.add('selected');
          BGM.sfx('select');
          if (choose(state, Number(el.getAttribute('data-index')))) render();
          break;
        case 'next':
          if (goNext(state)) render();
          break;
        case 'back':
          var prev = goBack(state);
          if (prev) { state = prev; ui.startAtEnd = true; render(); }
          break;
        case 'reroll':
          state = startGame(randomLife(null, profile));
          render();
          break;
        case 'result':
          state.screen = 'result';
          render();
          break;
        case 'confirm-restart':
          lastModalTrigger = el;
          confirmRestart();
          break;
        case 'restart':
          closeModal();
          state = newState();   // 前回のパラメータや結果は残りません
          render();
          break;
        case 'clinic':
          lastModalTrigger = el;
          clinicDetail(el.getAttribute('data-id'));
          break;
      }
    } finally {
      /* 画面の描き換えが終わってから次の操作を受け付ける */
      setTimeout(function () { busy = false; }, 150);
    }
  });

  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'setup-form') return;
    e.preventDefault();
    BGM.unlock();
    var name = document.getElementById('nick').value.replace(/\s+/g, ' ').trim();
    var err = document.getElementById('nick-err');
    if (!name) { err.textContent = '名前を入力するか、「🎲 おまかせ」を押してください。'; document.getElementById('nick').focus(); return; }
    if (name.length > 10) { err.textContent = '名前は10文字までで入力してください。'; return; }
    var checked = e.target.querySelector('input[name=gender]:checked');
    profile = { name: name, gender: checked ? checked.value : 'none' };
    state = startGame(randomLife(null, profile));
    render();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modalRoot.innerHTML) closeModal();
  });

  render();
})();

</script>
<script>
/* オフラインでも遊べるようにする（https で公開したときだけ動きます） */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  var hadController = !!navigator.serviceWorker.controller, reloaded = false;
  /* 新しい版が届いたら、自動で1回だけ読み込み直す */
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (r) { r.update(); }).catch(function () {}); });
}
</script>
</body>
</html>
