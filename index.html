<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>歯科人生ゲーム</title>
<meta name="description" content="15歳から始まる、あなたの歯科人生。選択で未来が変わる人生シミュレーションゲーム（試作版）">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2fb7a3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="歯科人生">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* =========================================================
   歯科人生ゲーム：デザイン
   白を基調に、ミントグリーンとブルーをアクセントにしています。
   ========================================================= */
:root {
  --bg: #f3f9f9;
  --surface: #ffffff;
  --ink: #23383a;
  --ink-soft: #5b7072;
  --line: #dde9e9;
  --mint: #2fb7a3;
  --mint-dark: #1f8f80;
  --mint-soft: #e3f6f2;
  --blue: #3b8fd9;
  --blue-soft: #e6f1fb;
  --lavender: #8a7fd6;
  --lavender-soft: #efedfb;
  --peach: #f08a5d;
  --peach-soft: #fdeee6;
  --gold: #e7b43c;
  --danger: #d9655b;
  --radius: 18px;
  --shadow: 0 6px 24px rgba(31, 90, 90, .08);
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }

/* ---------- ボタン ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 56px; padding: 0 28px;
  border: none; border-radius: 999px; cursor: pointer;
  font-size: 17px; font-weight: 700; letter-spacing: .04em;
  background: linear-gradient(135deg, var(--mint), #39a9d6);
  color: #fff;
  box-shadow: 0 8px 20px rgba(47, 183, 163, .32);
  transition: transform .12s, box-shadow .12s;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(47, 183, 163, .4); }
.btn:active { transform: translateY(1px) scale(.99); }
.btn:focus-visible, .choice:focus-visible, .icon-btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.btn.block { display: flex; width: 100%; }
.nowrap { display: inline-block; }
.btn.ghost {
  background: #fff; color: var(--mint-dark); box-shadow: none;
  border: 2px solid var(--mint);
}
.btn.small { min-height: 44px; font-size: 15px; padding: 0 20px; }

.icon-btn {
  display: inline-flex; align-items: center; gap: 4px;
  min-height: 40px; padding: 0 12px;
  background: transparent; border: none; border-radius: 10px;
  font-size: 14px; font-weight: 700; color: var(--ink-soft); cursor: pointer;
}
.icon-btn:hover { background: var(--mint-soft); color: var(--mint-dark); }
.icon-btn:disabled { opacity: .35; cursor: default; background: transparent; color: var(--ink-soft); }

/* ---------- タイトル画面 ---------- */
.title-screen {
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; justify-content: center;
  background:
    radial-gradient(circle at 15% 12%, rgba(47,183,163,.18) 0, transparent 38%),
    radial-gradient(circle at 88% 85%, rgba(59,143,217,.16) 0, transparent 40%),
    var(--bg);
  padding: 40px 0;
}
.title-card {
  background: var(--surface); border-radius: 28px; box-shadow: var(--shadow);
  padding: 40px 28px 32px; text-align: center; position: relative; overflow: hidden;
}
.title-card::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 6px;
  background: linear-gradient(90deg, var(--mint), var(--blue), var(--lavender));
}
.brand { font-size: 13px; font-weight: 700; color: var(--mint-dark); letter-spacing: .12em; }
.tooth-logo { width: 96px; height: 96px; margin: 18px auto 8px; display: block; }
.game-title {
  margin: 4px 0 6px; font-size: clamp(34px, 9vw, 48px); line-height: 1.25; letter-spacing: .06em;
  background: linear-gradient(135deg, var(--mint-dark), var(--blue));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.game-sub { margin: 0 0 22px; font-size: 18px; font-weight: 700; color: var(--ink); }
.game-desc { margin: 0 0 28px; color: var(--ink-soft); font-size: 16px; }
.title-meta {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 22px 0 0; padding: 0; list-style: none;
}
.title-meta li {
  font-size: 13px; color: var(--ink-soft); background: var(--bg); border-radius: 999px; padding: 4px 12px;
}
.demo-note { margin-top: 18px; font-size: 12px; color: var(--ink-soft); }

/* ---------- ゲーム中のヘッダー ---------- */
.game-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: rgba(255,255,255,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 6px; }
.stage-label { font-size: 13px; font-weight: 700; color: var(--mint-dark); text-align: center; flex: 1; line-height: 1.4; }
.stage-label small { display: block; color: var(--ink-soft); font-weight: 500; font-size: 11px; letter-spacing: .08em; }
.status-row { display: flex; align-items: center; gap: 14px; padding: 6px 0 12px; }
.age-badge {
  flex: none; display: flex; align-items: baseline; gap: 2px;
  background: var(--mint-soft); color: var(--mint-dark); border-radius: 14px; padding: 2px 14px;
  font-weight: 800;
}
.age-badge b { font-size: 30px; line-height: 1.3; }
.age-badge span { font-size: 14px; }
.age-badge.bump { animation: bump .5s ease; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }
.progress-box { flex: 1; min-width: 0; }
.progress-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; gap: 8px; }
.career-chip { font-weight: 700; color: var(--blue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress {
  height: 10px; background: var(--line); border-radius: 999px; overflow: hidden;
}
.progress i {
  display: block; height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--mint), var(--blue));
  transition: width .4s ease;
}

/* ---------- イベント ---------- */
.event { padding: 20px 0 48px; }
.event-card {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 24px 20px; animation: rise .3s ease;
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.event-kicker { font-size: 13px; font-weight: 700; color: var(--blue); letter-spacing: .06em; }
.event-title { margin: 2px 0 12px; font-size: 22px; line-height: 1.45; }
.event-text { margin: 0 0 16px; font-size: 16px; }
.terms {
  background: var(--blue-soft); border-radius: 12px; padding: 10px 14px; margin: 0 0 18px; font-size: 14px;
}
.terms dt { font-weight: 700; color: var(--blue); }
.terms dt::before { content: "💡 "; }
.terms dd { margin: 0 0 6px; color: var(--ink); }
.terms dd:last-child { margin-bottom: 0; }

.choices { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.choice {
  width: 100%; display: flex; align-items: flex-start; gap: 12px; text-align: left;
  min-height: 64px; padding: 14px 16px;
  background: #fff; border: 2px solid var(--line); border-radius: 16px; cursor: pointer;
  font-size: 16px; font-weight: 700; line-height: 1.55;
  transition: border-color .12s, background .12s, transform .12s, opacity .2s;
}
@media (hover: hover) {
  .choice:hover:not(:disabled) { border-color: var(--mint); background: var(--mint-soft); }
}
.choice:active:not(:disabled) { transform: scale(.985); }
.choice .letter {
  flex: none; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; font-size: 14px;
  background: var(--mint-soft); color: var(--mint-dark);
}
.choice .body { flex: 1; min-width: 0; }
.choice .desc { display: block; font-weight: 500; font-size: 14px; color: var(--ink-soft); margin-top: 2px; }
.choice:disabled { cursor: default; }
.choice.dim { opacity: .4; }
.choice.selected {
  border-color: var(--mint); background: var(--mint-soft);
  box-shadow: 0 0 0 4px rgba(47,183,163,.15);
}
.choice.selected .letter { background: var(--mint); color: #fff; }

/* 進路選択（職種カード） */
.choice.career { flex-direction: column; gap: 6px; }
.choice.career .career-head { display: flex; align-items: center; gap: 10px; font-size: 18px; }
.career-tag {
  font-size: 11px; font-weight: 800; letter-spacing: .06em; padding: 2px 8px; border-radius: 6px;
}
.c-mint { background: var(--mint-soft); color: var(--mint-dark); }
.c-blue { background: var(--blue-soft); color: var(--blue); }
.c-lavender { background: var(--lavender-soft); color: var(--lavender); }
.c-peach { background: var(--peach-soft); color: var(--peach); }
.choice.career .career-info { font-weight: 500; font-size: 14px; color: var(--ink-soft); line-height: 1.65; }
.choice.career .career-info b { color: var(--ink); }

/* 選択後の結果 */
.outcome {
  margin-top: 18px; padding: 18px; border-radius: 16px;
  background: linear-gradient(135deg, #f0fbf8, #eef6fd); border: 1px solid #cfeee7;
  animation: rise .25s ease;
}
.outcome-label { font-size: 13px; font-weight: 800; color: var(--mint-dark); letter-spacing: .08em; }
.outcome p { margin: 4px 0 12px; font-size: 16px; }
.outcome.pass { background: linear-gradient(135deg, #fff9e8, #f0fbf8); border-color: #f1dc9e; }
.outcome.fail { background: #fff5f3; border-color: #f4d3ce; }
.result-stamp {
  display: inline-block; font-size: 20px; font-weight: 800; padding: 2px 16px; border-radius: 10px; margin: 4px 0 6px;
}
.pass .result-stamp { background: var(--gold); color: #fff; }
.fail .result-stamp { background: var(--danger); color: #fff; }
.deltas { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; padding: 0; list-style: none; }
.deltas li {
  font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
  background: #fff; color: var(--mint-dark); border: 1px solid #cfeee7;
}
.deltas li.down { color: var(--ink-soft); border-color: var(--line); }

/* ---------- エンディング ---------- */
.ending {
  min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; padding: 40px 0;
  background: linear-gradient(160deg, #e3f6f2 0%, #e6f1fb 60%, #efedfb 100%);
}
.ending-card {
  background: #fff; border-radius: 28px; box-shadow: var(--shadow); padding: 36px 24px; text-align: center;
  animation: rise .4s ease;
}
.ending-age { font-size: 15px; font-weight: 700; color: var(--mint-dark); letter-spacing: .1em; }
.ending-age b { display: block; font-size: 64px; line-height: 1.1; color: var(--ink); letter-spacing: 0; }
.ending-title { font-size: 22px; margin: 12px 0 18px; line-height: 1.5; }
.ending-story { text-align: left; margin: 0 0 28px; padding: 0; list-style: none; }
.ending-story li { margin-bottom: 10px; padding-left: 20px; position: relative; }
.ending-story li::before { content: ""; position: absolute; left: 4px; top: .7em; width: 8px; height: 8px; border-radius: 50%; background: var(--mint); }

/* ---------- 結果画面 ---------- */
.result { padding-bottom: 48px; }
.result-hero {
  position: relative; overflow: hidden; color: #fff; text-align: center;
  background: linear-gradient(140deg, #22a894 0%, #3b8fd9 70%, #7d74d1 100%);
  padding: 40px 0 72px;
}
.result-hero .confetti { position: absolute; inset: 0; pointer-events: none; }
.result-hero .confetti i { position: absolute; width: 10px; height: 10px; border-radius: 3px; opacity: .55; }
.hero-kicker { font-size: 13px; font-weight: 700; letter-spacing: .2em; opacity: .9; }
.hero-title { margin: 6px 0 4px; font-size: clamp(28px, 7vw, 38px); letter-spacing: .08em; }
.hero-life { font-size: 17px; font-weight: 700; margin: 0; opacity: .95; }
.type-medal {
  position: relative; margin: -48px auto 0; max-width: 560px;
  background: #fff; border-radius: 24px; box-shadow: 0 12px 32px rgba(31,90,90,.14);
  padding: 22px 20px; text-align: center;
}
.type-medal .icon { font-size: 44px; line-height: 1; }
.type-medal .label { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-top: 8px; }
.type-medal h2 { margin: 2px 0 4px; font-size: 23px; line-height: 1.45; color: var(--mint-dark); }
.type-medal .catch { margin: 0; font-size: 15px; color: var(--ink-soft); }
.type-medal .subtype { display: inline-block; margin-top: 10px; font-size: 13px; background: var(--blue-soft); color: var(--blue); border-radius: 999px; padding: 3px 12px; font-weight: 700; }

.section {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 22px 20px; margin-top: 18px;
}
.section-head { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; }
.section-head .num {
  flex: none; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center;
  background: var(--mint-soft); color: var(--mint-dark); font-weight: 800; font-size: 14px;
}
.section-head h3 { margin: 0; font-size: 19px; }
.section p { margin: 0 0 12px; }
.sub-h { font-size: 15px; font-weight: 800; color: var(--mint-dark); margin: 18px 0 8px; }

/* 振り返りタイムライン */
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 27px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.timeline li { display: flex; gap: 12px; align-items: flex-start; padding: 6px 0; position: relative; }
.timeline .t-age {
  flex: none; width: 56px; text-align: center; font-size: 13px; font-weight: 800; color: var(--mint-dark);
  background: #fff; border: 2px solid var(--mint-soft); border-radius: 999px; padding: 2px 0; position: relative; z-index: 1;
}
.timeline .t-body { font-size: 15px; padding-top: 2px; }
.timeline .t-body small { display: block; color: var(--ink-soft); font-size: 12px; }

/* キャリアの流れ */
.path { display: flex; flex-direction: column; gap: 0; margin: 0; padding: 0; list-style: none; }
.path li { display: flex; align-items: center; gap: 12px; }
.path li + li::before { content: ""; }
.path .p-dot {
  flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: var(--blue-soft); color: var(--blue); font-weight: 800; font-size: 13px;
}
.path li:last-child .p-dot { background: linear-gradient(135deg, var(--mint), var(--blue)); color: #fff; }
.path .p-text { font-weight: 700; font-size: 15px; }
.path .p-arrow { width: 44px; text-align: center; color: var(--line); font-size: 14px; line-height: 1; height: 18px; }

/* リスト */
.check-list { margin: 0; padding: 0; list-style: none; }
.check-list li { position: relative; padding-left: 26px; margin-bottom: 6px; font-size: 15px; }
.check-list li::before {
  content: "✓"; position: absolute; left: 0; top: 1px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--mint); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center;
}
.reason-list { margin: 0; padding: 0; list-style: none; }
.reason-list li { background: var(--bg); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; font-size: 15px; }
.reason-list b { color: var(--mint-dark); margin-right: 6px; }
.tend { margin-bottom: 12px; }
.tend-label { font-weight: 800; font-size: 15px; }
.tend-from { font-size: 14px; color: var(--ink-soft); }
.advice-box { background: linear-gradient(135deg, #f0fbf8, #eef6fd); border-radius: 14px; padding: 14px 16px; font-size: 15px; }

/* 可視化 */
.viz { display: grid; grid-template-columns: 1fr; gap: 12px; align-items: center; }
.radar { width: 100%; max-width: 360px; margin: 0 auto; display: block; }
.bars { margin: 0; padding: 0; list-style: none; }
.bars li { display: grid; grid-template-columns: 9.5em 1fr; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 6px; }
.bars .bar { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bars .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--mint), var(--blue)); border-radius: 999px; }
.bars li.top { font-weight: 800; }
.viz-note { font-size: 12px; color: var(--ink-soft); margin: 4px 0 0; }

/* 医院カード */
.clinic {
  border: 2px solid var(--line); border-radius: 18px; padding: 18px 16px; margin-top: 14px; position: relative;
}
.clinic.rank-1 { border-color: var(--mint); background: linear-gradient(180deg, #f5fcfa, #fff 40%); }
.clinic-top { display: flex; align-items: flex-start; gap: 12px; }
.rank {
  flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 800; color: #fff; background: #a9bfc1; font-size: 15px; line-height: 1;
}
.rank-1 .rank { background: var(--gold); }
.rank-2 .rank { background: #9fb3c8; }
.rank-3 .rank { background: #d3a07e; }
.clinic-name { font-size: 18px; font-weight: 800; margin: 0; line-height: 1.45; }
.clinic-catch { font-size: 14px; color: var(--ink-soft); margin: 2px 0 0; }
.demo-badge {
  display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .04em;
  color: var(--peach); background: var(--peach-soft); border: 1px solid #f6c9b3; border-radius: 6px; padding: 1px 8px; margin-bottom: 4px;
}
.match-meter { display: flex; align-items: center; gap: 12px; margin: 14px 0 10px; }
.match-meter .pct { font-size: 28px; font-weight: 800; color: var(--mint-dark); line-height: 1; }
.match-meter .pct small { font-size: 14px; }
.match-meter .meter-body { flex: 1; }
.match-meter .stars { color: var(--gold); font-size: 15px; letter-spacing: 2px; }
.match-meter .stars .off { color: var(--line); }
.match-meter .meter-label { font-size: 12px; color: var(--ink-soft); }
.points { margin: 0 0 12px; padding: 0; list-style: none; }
.points li {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center;
  background: var(--bg); border-radius: 12px; padding: 8px 10px; margin-bottom: 6px; font-size: 13px; line-height: 1.5;
}
.points .you b, .points .them b { display: block; font-size: 11px; color: var(--ink-soft); font-weight: 700; }
.points .you { color: var(--ink); font-weight: 700; }
.points .you span { display: block; font-weight: 500; color: var(--ink-soft); font-size: 12px; }
.points .link { color: var(--mint); font-weight: 800; }
.points .them { color: var(--blue); font-weight: 700; }
.clinic-reason { font-size: 14px; margin: 0 0 14px; }

.disclaimer {
  margin-top: 18px; font-size: 13px; color: var(--ink-soft); background: #fff; border-radius: 14px; padding: 14px 16px; border: 1px dashed #c9dcdc;
}
.result-actions { margin-top: 24px; display: grid; gap: 12px; }

/* ---------- モーダル ---------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 50; background: rgba(20, 45, 48, .45);
  display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: #fff; width: 100%; max-width: 640px; max-height: 92vh; max-height: 92dvh; overflow-y: auto;
  border-radius: 24px 24px 0 0; padding: 22px 20px calc(24px + env(safe-area-inset-bottom));
  animation: slideup .25s ease;
}
@keyframes slideup { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.modal h2 { font-size: 21px; margin: 4px 0 2px; line-height: 1.45; }
.modal .area { font-size: 13px; color: var(--ink-soft); margin: 0 0 10px; }
.modal .close {
  flex: none; width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--bg); font-size: 20px; cursor: pointer;
}
.modal .close:hover { background: var(--mint-soft); }
.demo-banner {
  background: var(--peach-soft); color: #b55a31; border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 700; margin: 8px 0 14px;
}
.spec { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0 4px; }
.spec th, .spec td { border-bottom: 1px solid var(--line); padding: 10px 6px; text-align: left; vertical-align: top; }
.spec th { width: 6.5em; color: var(--ink-soft); font-weight: 700; white-space: nowrap; }
.modal .sub-h:first-of-type { margin-top: 8px; }
.modal-actions { margin-top: 20px; display: grid; gap: 10px; }
.confirm { text-align: center; }
.confirm p { margin: 8px 0 18px; }

/* =========================================================
   物語の場面（ドット絵のステージと会話ウィンドウ）
   ========================================================= */
.scene { padding: 14px 0 48px; }
.stage {
  position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
  border-radius: 14px; background: #1b2346 center / cover no-repeat;
  image-rendering: pixelated; image-rendering: crisp-edges;
  box-shadow: 0 0 0 3px #fff, 0 0 0 6px #cfe7e2, var(--shadow);
}
.stage::after {   /* 走査線のようなうっすらした質感 */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 3px);
}
.chara {
  position: absolute; bottom: 2%; height: 84%; width: auto; aspect-ratio: 2 / 3;
  image-rendering: pixelated; image-rendering: crisp-edges;
  transition: left .35s ease, filter .2s ease, opacity .3s ease;
  transform-origin: 50% 100%;
  filter: drop-shadow(0 3px 0 rgba(20,30,60,.25));
}
.chara.pos-me { left: 14%; }
.chara.pos-r  { left: 58%; }
.chara.pos-r1 { left: 47%; }
.chara.pos-r2 { left: 70%; }
.chara.flip { transform: scaleX(-1); }
.chara.listen { filter: brightness(.82) saturate(.85) drop-shadow(0 3px 0 rgba(20,30,60,.25)); }
.chara.enter { animation: chara-in .35s steps(4) both; }
@keyframes chara-in { from { opacity: 0; translate: 0 6%; } to { opacity: 1; translate: 0 0; } }
.chara.a-hop   { animation: a-hop .5s steps(5); }
.chara.a-shake { animation: a-shake .4s steps(6); }
.chara.a-nod   { animation: a-nod .5s steps(4); }
.chara.a-slump { animation: a-slump .7s steps(4) both; }
@keyframes a-hop   { 0%,100% { translate: 0 0; } 40% { translate: 0 -9%; } 70% { translate: 0 -3%; } }
@keyframes a-shake { 0%,100% { translate: 0 0; } 25% { translate: -3% 0; } 50% { translate: 3% 0; } 75% { translate: -2% 0; } }
@keyframes a-nod   { 0%,100% { translate: 0 0; } 50% { translate: 0 3%; } }
@keyframes a-slump { from { translate: 0 0; } to { translate: 0 3%; } }

.chapter-card {
  position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
  padding: 14px 16px; text-align: center; color: #fff; font-size: clamp(18px, 5vw, 26px); font-weight: 800; letter-spacing: .1em;
  background: linear-gradient(90deg, transparent, rgba(16,24,52,.82) 15%, rgba(16,24,52,.82) 85%, transparent);
  opacity: 0; transition: opacity .4s; z-index: 3;
}
.chapter-card small { display: block; font-size: 13px; color: #9ef0e0; letter-spacing: .3em; }
.chapter-card.show { opacity: 1; }
.stage.is-chapter .chara { opacity: 0; }

.dialog-wrap { position: relative; margin-top: 14px; }
.dialog {
  position: relative; display: block; width: 100%; min-height: 112px; text-align: left; cursor: pointer;
  padding: 22px 18px 18px; border: none; border-radius: 6px;
  background: #fff; color: var(--ink); font-size: 17px; line-height: 1.8;
  box-shadow: 0 0 0 3px #23383a, 0 0 0 6px #fff, 0 0 0 8px #9ad9cd, 0 8px 22px rgba(31,90,90,.15);
}
.dialog:focus-visible { outline: 3px solid var(--blue); outline-offset: 10px; }
.nameplate {
  position: absolute; top: -14px; left: 14px; padding: 2px 14px; border-radius: 4px;
  background: #23383a; color: #9ef0e0; font-size: 14px; font-weight: 800; letter-spacing: .06em;
}
.line { display: block; min-height: 3.6em; white-space: pre-wrap; }
.line.narration { color: #3e5658; }
.cue { position: absolute; right: 14px; bottom: 8px; color: var(--mint); font-size: 13px; animation: cue 1s steps(2) infinite; }
@keyframes cue { 50% { opacity: 0; } }
.dialog-tools { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; min-height: 34px; flex-wrap: wrap; }
.tool-btn {
  min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: #fff; color: var(--ink-soft); font-size: 13px; font-weight: 700; cursor: pointer;
}
.tool-btn:hover { border-color: var(--mint); color: var(--mint-dark); }
.choice-panel {
  margin-top: 8px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 18px 16px; animation: rise .25s ease;
}
.choice-panel .event-title { font-size: 19px; margin-bottom: 12px; }
.scene .outcome { margin-top: 8px; }
.outcome-label { font-size: 14px; }

/* 人生アルバム（結果画面） */
.album { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0; padding: 0; list-style: none; }
.album li { text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.album .frame {
  aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden; display: flex; align-items: flex-end; justify-content: center;
  background: #1b2346 center / cover no-repeat; image-rendering: pixelated; margin-bottom: 4px;
  box-shadow: 0 0 0 2px #fff, 0 0 0 4px #cfe7e2;
}
.album .frame img { height: 86%; image-rendering: pixelated; }
.album b { display: block; color: var(--mint-dark); font-size: 14px; }

details.terms { padding: 6px 12px; margin: 0 0 8px; }

@media (min-width: 600px) {

}

var JOB_AGE = { dh: 21, dds: 25, dt: 20, da: 18 };

function jobAge(s) {
  return (JOB_AGE[s.career] || 21) + (s.shift || 0);
}
/* 就職後のイベント：働き始め〜29歳の間に f(0〜1) の割合で配置 */

  return function (s) {
    var start = jobAge(s);
    return Math.min(29, start + Math.round((29 - start) * f));
  };
}

    var player = {
      name: name, gain: g, step: 0, next: ctx.currentTime + 0.05,
      mel: parse(tr.melody), bass: parse(tr.bass), dr: parse(tr.drums),
      chords: tr.chords.map(chord), stepDur: 60 / tr.bpm / 2
    };
    player.timer = setInterval(function () { schedule(player, tr); }, 25);
    cur = player;
  }
  function stopTrack(p) {
    if (!p) return;
    var t = ctx.currentTime;
    p.gain.gain.cancelScheduledValues(t);
    p.gain.gain.setValueAtTime(p.gain.gain.value, t);
    p.gain.gain.linearRampToValueAtTime(0, t + 0.6);
    setTimeout(function () { clearInterval(p.timer); try { p.gain.disconnect(); } catch (e) { /* 何もしない */ } }, 700);
  }

  function schedule(p, tr) {
    while (p.next < ctx.currentTime + 0.15) {
      var t = p.next, step = p.step, bar = Math.floor(step / 8) % 4, pos = step % 8;
      var ch = p.chords[bar], sd = p.stepDur;
      /* 和音（小節の頭でやわらかく） */
      if (pos === 0) ch.iv.forEach(function (iv) { tone(p.gain, 'triangle', freq(48 + 12 + ch.root + iv), t, sd * 8, 0.035, 0.15, 0.4); });
      /* メロディ（またはオルゴールの分散和音） */
      if (tr.arp) {
        var seq = ch.iv.concat([12]).concat(ch.iv.slice(1).reverse());
        var n = 72 + ch.root + seq[pos % seq.length];
        tone(p.gain, 'sine', freq(n), t, sd * 1.8, 0.18, 0.005, sd * 1.5);
        tone(p.gain, 'sine', freq(n + 12), t, sd * 0.6, 0.04, 0.005, sd * 0.5);
      } else if (p.mel.length) {
        var i = step % p.mel.length, tk = p.mel[i];
        if (tk !== '~' && tk !== '.') {
          var len = 1;
          while (p.mel[(i + len) % p.mel.length] === '~' && len < 8) len++;
          var m = midi(tk);
          if (m) tone(p.gain, tr.lead, freq(m), t, sd * len * 0.92, tr.lead === 'square' ? 0.07 : 0.16, 0.01, 0.06);
        }
      }
      /* ベース */
      if (p.bass.length) {
        var b = p.bass[pos % p.bass.length];
        if (b === 'R' || b === 'F') {
          var bl = 1;
          while (p.bass[(pos + bl) % p.bass.length] === '~' && pos + bl < 8) bl++;
          tone(p.gain, 'triangle', freq(36 + ch.root + (b === 'F' ? 7 : 0)), t, sd * bl * 0.9, 0.2, 0.01, 0.05);
        }
      }
      /* ドラム */
      if (p.dr.length) {
        var dk = p.dr[pos % p.dr.length];
        if (dk === 'k' || dk === 's' || dk === 'h') drum(p.gain, dk, t, tr.drumVol || 1);
      }
      p.step++;
      p.next += sd;
    }
  }

  function apply() {
    if (!ctx || muted) return;
    if (cur && cur.name === wanted) return;
    stopTrack(cur); cur = null;
    if (wanted) startTrack(wanted);
  }

  return {
    /* 曲を切り替える（同じ曲なら何もしない） */
    play: function (name) { wanted = name; apply(); },
    /* ボタン操作のたびに呼ぶ（ブラウザの自動再生ルール対策） */
    unlock: function () {
      if (!ensure()) return;
      if (ctx.state === 'suspended' && !muted) ctx.resume();
      apply();
    },
    /* 効果音 */
    sfx: function (kind) {
      if (!ctx || muted) return;
      var t = ctx.currentTime;
      if (kind === 'select') { tone(master, 'square', freq(84), t, 0.06, 0.12); tone(master, 'square', freq(91), t + 0.06, 0.08, 0.12); }
      if (kind === 'pass') [72, 76, 79, 84].forEach(function (n, i) { tone(master, 'square', freq(n), t + i * 0.1, 0.16, 0.12); });
      if (kind === 'page') tone(master, 'triangle', freq(88), t, 0.03, 0.05);
    },
    isMuted: function () { return muted; },
    toggle: function () {
      muted = !muted;
      try { localStorage.setItem('dental-life-muted', muted ? '1' : '0'); } catch (e) { /* 何もしない */ }
      if (!ensure()) return muted;
      master.gain.setValueAtTime(muted ? 0 : VOLUME, ctx.currentTime);
      if (muted) { stopTrack(cur); cur = null; } else { ctx.resume(); apply(); }
      return muted;
    },
    tracks: Object.keys(TRACKS),
    /* 動作確認用：今の状態と音の大きさ */
    debug: function () {
      var peak = 0;
      if (meter) { var b = new Float32Array(meter.fftSize); meter.getFloatTimeDomainData(b); for (var i = 0; i < b.length; i++) peak = Math.max(peak, Math.abs(b[i])); }
      return { context: ctx ? ctx.state : 'なし', track: cur ? cur.name : null, wanted: wanted, muted: muted, peak: Math.round(peak * 1000) / 1000 };
    }
  };
})();

  <script>
/* =========================================================
   歯科人生ゲーム：ゲームの進行と診断のしくみ（画面表示とは独立）
   ---------------------------------------------------------
   このファイルは画面(HTML)を触りません。
   そのため、ブラウザ以外（自動テスト）でも同じ処理を確認できます。
   ========================================================= */

/* ---------- 試験の難しさ（合格に必要な点数） ----------
   点数 ＝ 勉強ポイント ＋ 技術・安定性が高いとボーナス − ストレスが高いとマイナス
   （tests/simulate.js で、ランダムに選んだ場合の合格率を確認して調整） */
var ENTRANCE_PASS = { normal: 0, private: 1, public: 4 };
var EXAM_PASS = { dh: 4, dds: 4, dt: 3 };

/* 診断のとき、パラメータごとの「出やすさ」の差をならすための基準値。
   （tests/simulate.js で多数のランダムプレイを行い、平均値から設定） */
var PARAM_BASE = { comm: 7.8, tech: 10.5, coop: 11.6, init: 10.2, wlb: 8.3, stab: 10.8, career: 8.8, rel: 7.1 };

/* 振り返りに表示する主要イベント */
var KEY_EVENTS = ['hs_start', 'hs_dentist', 'hs_baito', 'hs_opencampus', 'career_select', 'entrance', 'ronin', 'dh_clinical', 'dds_clinical',
  'dt_team', 'da_prep', 'exam', 'retake', 'retake2', 'dds_resident', 'job_decide', 'w_mistake', 'w_burnout', 'w_cert', 'w_family',
  'w_change', 'w_future'];

function newState() {
  var params = {};
  PARAMS.forEach(function (p) { params[p.key] = 0; });
  return {
    screen: 'title',      // title / event / ending / result
    cursor: -1,           // 今いるイベントの番号（EVENTS の何番目か）
    pending: null,        // 選択肢を選んだ後の結果（「次へ」を押す前）
    career: null,
    workplace: null,
    shift: 0,             // 浪人などで、その後の年齢が何年ずれたか
    preShift: 0,          // そのうち入学前（入試の浪人）の分
    study: 0,
    stress: 0,            // ストレス（たまりすぎると体調を崩す）
    money: 0,             // 貯金（万円）
    debt: 0,              // 借金（奨学金・ローン）
    repay: 0,             // 毎年の返済額
    income: 0,            // 年収
    saveRate: BASE_SAVE_RATE,
    moneyLog: [],         // 年齢ごとのお金の記録（グラフ用）
    moneyNotes: [],       // 大きなお金の出来事
    params: params,
    prefs: {},
    tags: {},
    flags: {},
    bonds: {},            // 人間関係（友人・先生・先輩など）の深さ
    life: null,           // ランダムに決まる生まれ・見た目
    log: [],              // 人生の記録
    contrib: {},          // どの選択でどのパラメータが上がったか
    prefSrc: {},          // どの選択でどの希望を記録したか
    history: []           // 「戻る」用のスナップショット
  };
}

function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

/* ---------- 関数かもしれない値を取り出す ---------- */
function val(v, s, extra) { return typeof v === 'function' ? v(s, extra) : v; }
/* 学校編の年齢は、入試で浪人した分だけ後ろにずれる */
function evAge(ev, s) { var a = val(ev.age, s); if (typeof ev.age === 'number' && ev.stage === 5) a += s.preShift || 0; return a; }
function evTitle(ev, s) { return val(ev.title, s); }
function evText(ev, s) { return val(ev.text, s); }
function evTerms(ev, s) { return val(ev.terms, s) || []; }
function evChoices(ev, s) { return val(ev.choices, s); }

function isActive(ev, s, assumeCareer) {
  var career = s.career || assumeCareer;
  if (ev.career && (!career || ev.career.indexOf(career) < 0)) return false;
  if (ev.when && !ev.when(s)) return false;
  return true;
}

function nextIndex(s, from) {
  for (var i = from + 1; i < EVENTS.length; i++) {
    if (isActive(EVENTS[i], s)) return i;
  }
  return -1;
}

function currentEvent(s) { return s.cursor >= 0 ? EVENTS[s.cursor] : null; }

function currentAge(s) {
  if (s.screen === 'ending' || s.screen === 'result') return 30;
  var ev = currentEvent(s);
  return ev ? evAge(ev, s) : 15;
}

/* ---------- お金の処理 ---------- */
/* 貯金を増減する。足りない分は借金（奨学金・家族からの借入）になる */
function addMoney(s, v) {
  s.money += v;
  if (s.money < 0) {
    s.debt += -s.money;
    s.money = 0;
    s.repay = Math.max(s.repay, 12, Math.round(s.debt / 15));
  }
}
function addDebt(s, v) {
  s.debt += v;
  s.repay = Math.max(12, Math.round(s.debt / 15));
}
/* 学費を払う（家族の援助 → 自分の貯金の半分まで → 足りない分は奨学金） */
function payTuition(s, total, label) {
  var fam = Math.round(total * supportRate(s));
  var rest = total - fam;
  var own = Math.min(Math.floor(s.money / 2), rest);
  var loan = rest - own;
  s.money -= own;
  if (loan > 0) addDebt(s, loan);
  var note = label + 'の学費 ' + yen(total) + '（家族の援助 ' + yen(fam) + (own ? '・自分の貯金 ' + yen(own) : '') + (loan ? '・奨学金 ' + yen(loan) : '') + '）';
  s.moneyNotes.push(note);
  return note;
}
/* 1年が過ぎたときのお金の動き */
function passYear(s) {
  if (s.income > 0) s.money += Math.round(s.income * Math.max(0.03, s.saveRate));
  if (s.debt > 0 && s.income > 0) {
    var p = Math.min(s.debt, s.repay);
    s.debt -= p;
    s.money -= p;
    if (s.money < 0) { s.debt += -s.money; s.money = 0; }
  }
  if (s.income > 0) s.income = Math.round(s.income * 1.02);   // 毎年少しずつ昇給
  if (s.income > 0) s.stress += 1;                               // 働いていると、疲れが少しずつたまる
}
function logMoney(s, age) {
  var last = s.moneyLog[s.moneyLog.length - 1];
  var row = { age: age, money: Math.round(s.money), debt: Math.round(s.debt) };
  if (last && last.age === age) s.moneyLog[s.moneyLog.length - 1] = row; else s.moneyLog.push(row);
}

/* ストレスの自動計算：キャリア・技術を無理に伸ばす選択はたまり、休む選択は減る */
function stressOf(c) {
  if (typeof c.st === 'number') return c.st;
  var e = c.e || {}, v = 0;
  if ((e.career || 0) > 0 || (e.tech || 0) >= 2) v += 1;
  if ((e.wlb || 0) > 0) v -= e.wlb;
  return v;
}

function examScore(s) {
  var p = s.params;
  return s.study + (p.tech >= 8 ? 1 : 0) + (p.stab >= 8 ? 1 : 0) - (s.stress >= 6 ? 1 : 0) - (s.stress >= 10 ? 1 : 0);
}

/* ---------- ゲームの操作 ---------- */
/* life を省略すると、生まれと見た目がランダムに決まります */
function startGame(life) {
  var s = newState();
  s.life = life || randomLife();
  /* 生まれ育った町・家庭が、最初の傾向に少しだけ影響する */
  [findOrigin(ORIGIN_TOWNS, s.life.town), findOrigin(ORIGIN_FAMILIES, s.life.family)].forEach(function (o) {
    Object.keys(o.e).forEach(function (k) {
      s.params[k] += o.e[k];
      (s.contrib[k] = s.contrib[k] || []).push({ label: o.label, age: 15, v: o.e[k] });
    });
  });
  s.money = findWealth(s.life.wealth).start;
  s.screen = 'event';
  s.cursor = nextIndex(s, -1);
  logMoney(s, 15);
  return s;
}

/* 選択肢を選ぶ。選んだ前の状態を保存してから反映するので、
   「戻る」で元に戻しても二重に加算されません。 */
function choose(s, ci) {
  if (s.screen !== 'event' || s.pending) return false;   // 連打・二重進行の防止
  var ev = currentEvent(s);
  var choices = evChoices(ev, s);
  var c = choices[ci];
  if (!c) return false;

  var snap = clone(s);
  snap.history = [];
  s.history.push(JSON.stringify(snap));

  var age = evAge(ev, s);
  var label = c.log || c.t;
  var deltas = [];
  var money0 = s.money, debt0 = s.debt, income0 = s.income;

  if (c.career) s.career = c.career;
  if (c.workplace) s.workplace = c.workplace;

  Object.keys(c.e || {}).forEach(function (k) {
    s.params[k] += c.e[k];
    deltas.push({ key: k, v: c.e[k] });
    if (c.e[k] > 0) {
      (s.contrib[k] = s.contrib[k] || []).push({ label: label, age: age, v: c.e[k] });
    }
  });
  Object.keys(c.p || {}).forEach(function (k) {
    s.prefs[k] = (s.prefs[k] || 0) + c.p[k];
    (s.prefSrc[k] = s.prefSrc[k] || []).push(label);
  });
  (c.tag || []).forEach(function (t) {
    s.tags[t] = (s.tags[t] || 0) + 1;
    (s.prefSrc['tag:' + t] = s.prefSrc['tag:' + t] || []).push(label);
  });
  Object.keys(c.flag || {}).forEach(function (k) { s.flags[k] = c.flag[k]; });
  Object.keys(c.b || {}).forEach(function (k) { s.bonds[k] = (s.bonds[k] || 0) + c.b[k]; });
  s.study += c.s || 0;
  s.stress = Math.max(0, s.stress + stressOf(c));
  if (c.money) addMoney(s, c.money);
  if (c.debt) addDebt(s, c.debt);
  if (c.rate) s.saveRate += c.rate;
  if (c.income) s.income = Math.max(0, s.income + c.income);

  var result = val(c.r, s, c) || val(ev.r, s, c) || '';
  var cname = s.career ? CAREERS[s.career].name : '';

  /* ---- 入学試験：勉強ポイントと志望校の難しさで合否が決まる ---- */
  if (ev.type === 'entrance') {
    var target = c.target || 'normal';
    s.flags.target = target;
    if (s.study >= ENTRANCE_PASS[target]) {
      var tu = s.career === 'dds' ? TUITION.dds[target] : TUITION[s.career].normal;
      result = '合格！ ' + (s.career === 'dds' ? (target === 'public' ? '国公立' : '私立') + '大学の歯学部' : CAREERS[s.career].school) + 'への進学が決まった。' + payTuition(s, tu, TUITION[s.career].label) + '。';
      label = (s.career === 'dds' ? (target === 'public' ? '国公立' : '私立') + '大学の歯学部に合格' : CAREERS[s.career].school + 'に合格');
    } else {
      result = '不合格…。掲示板に自分の番号はなかった。春からは浪人生活が始まる。';
      label = (s.career === 'dds' && target === 'public' ? '国公立の歯学部' : '入試') + 'は不合格（浪人へ）';
      s.flags.ronin = true;
      s.preShift = 1;
      s.shift += 1;
    }
  }
  /* ---- 浪人：1年の過ごし方で、翌年の入試の結果が変わる ---- */
  if (ev.type === 'ronin') {
    if (c.switchTo) {
      s.career = c.switchTo;
      s.flags.switched = true;
      result = '歯科衛生士に進路を変え、養成校に合格した。' + payTuition(s, TUITION.dh.normal, TUITION.dh.label) + '。';
      label = c.log;
    } else {
      var tg = s.flags.target || 'normal';
      var score = s.study + (c.bonus || 0);
      if (s.career === 'dds' && tg === 'public' && score < ENTRANCE_PASS.public) {
        result = '国公立はまたしても届かなかった…。それでも私立の歯学部に合格。ただし学費は莫大だ。' + payTuition(s, TUITION.dds['private'], TUITION.dds.label) + '。';
        label = c.log + '（私立の歯学部に合格）';
      } else {
        var tu2 = s.career === 'dds' ? TUITION.dds[tg] : TUITION[s.career].normal;
        result = '1年間の努力が実り、合格！ ' + payTuition(s, tu2, TUITION[s.career].label) + '。';
        label = c.log + '（翌年に合格）';
      }
    }
  }

  /* ---- 国家試験：勉強ポイント・技術・安定性・ストレスで合否が決まる ---- */
  if (ev.type === 'exam' || ev.type === 'retake') {
    var lic = CAREERS[s.career].license;
    var sc = examScore(s) + (c.bonus || 0) + (ev.type === 'retake' ? 1 : 0);
    if (sc >= EXAM_PASS[s.career]) {
      result = (ev.type === 'retake' ? '1年間の浪人生活を乗り越えて、' : '見事、') + lic + 'に合格！ ' + cname + 'の免許を取得しました。';
      label = (ev.type === 'retake' ? c.log + '（' + lic + 'に合格）' : lic + 'に合格');
      s.flags.passed = true;
    } else if (ev.type === 'exam') {
      result = '結果は…不合格。勉強が足りなかったのか、緊張に負けたのか。就職の内定も取り消しになり、浪人生活が始まる。';
      label = lic + 'は不合格（浪人へ）';
      s.flags.failed = true;
      s.shift += 1;
    } else {
      result = 'またしても不合格…。働きながらの勉強は思った以上に厳しかった。もう1年、挑戦することに。';
      label = c.log + '（2度目も不合格）';
      s.flags.failed2 = true;
      s.shift += 1;
    }
  }
  if (ev.type === 'retake2') {
    s.flags.passed = true;
    result = '3度目の正直。ついに' + CAREERS[s.career].license + 'に合格！ 遠回りした分、人の痛みがわかる' + cname + 'になれそうだ。';
  }

  /* ---- 歯科医師の臨床研修：研修医としての給料 ---- */
  if (ev.id === 'dds_resident') s.income = RESIDENT_INCOME;

  /* ---- 就職先：人気の職場は選考あり。力が足りないと不採用 ---- */
  if (ev.type === 'workplace') {
    if (c.req) {
      var pts = c.req.keys.reduce(function (a, k) { return a + s.params[k]; }, 0);
      if (pts < c.req.min) {
        var fb = choices[c.fallback];
        s.workplace = fb.workplace;
        s.flags.rejected = true;
        label = c.workplace + 'は不採用 → ' + fb.workplace + 'に就職';
        result = '「' + c.workplace + '」は人気が高く、残念ながら不採用…。気持ちを切り替えて、「' + fb.workplace + '」に就職しました。';
      }
    }
    s.income = (INCOME[s.career] || 280) + (WORKPLACE_BONUS[s.workplace] || 0);
    if (s.career === 'dds') s.saveRate += 0.08;   // 年収が高い分、貯金に回せる割合も大きい
    if (!s.flags.rejected) result = val(ev.r, s, c);
    else result += '初任給は年収' + yen(s.income) + '。';
  }

  /* ---- 開業・独立：自己資金が足りないと融資の審査に落ちる ---- */
  if (c.open) {
    var op = OPENING[s.career];
    var gift = op.need ? findWealth(s.life.wealth).gift : 0;
    if (s.money + gift >= op.need) {
      if (gift) { var use = Math.min(gift, Math.max(op.need - s.money, Math.round(op.need / 2))); s.money += use; s.moneyNotes.push('開業のため、実家から ' + yen(use) + 'の援助を受けた'); }
      s.money -= op.need;
      if (op.loan) addDebt(s, op.loan);
      s.income = op.income;
      s.flags.independent = true;
      result = op.label + 'を実現！ ' + op.detail + '。自己資金 ' + yen(op.need) + (op.loan ? '、銀行から ' + yen(op.loan) + 'を借りて' : 'で') + 'のスタートです。';
      s.moneyNotes.push(op.label + '：自己資金 ' + yen(op.need) + (op.loan ? '＋借入 ' + yen(op.loan) : ''));
    } else {
      s.flags.loanRejected = true;
      s.flags.stay = true;
      label = op.label + 'をめざしたが、資金が足りず断念';
      result = op.label + 'を考えたけれど、自己資金が' + yen(op.need - s.money - gift) + '足りず、銀行の融資審査に通らなかった…。今の職場で働きながら、資金を貯め直すことにした。';
      s.moneyNotes.push(op.label + 'を計画 → 自己資金不足で断念');
    }
  }

  s.log.push({ id: ev.id, age: age, stage: ev.stage, title: evTitle(ev, s), text: label });
  logMoney(s, age);
  s.pending = {
    ci: ci, result: result, deltas: deltas,
    money: Math.round(s.money - money0), debt: Math.round(s.debt - debt0), income: Math.round(s.income - income0)
  };
  return true;
}

function goNext(s) {
  if (s.screen !== 'event' || !s.pending) return false;
  var fromAge = evAge(currentEvent(s), s);
  s.pending = null;
  var n = nextIndex(s, s.cursor);
  var toAge = n < 0 ? 30 : evAge(EVENTS[n], s);
  for (var a = fromAge; a < toAge; a++) { passYear(s); logMoney(s, a + 1); }
  if (n < 0) {
    s.screen = 'ending';
  } else {
    s.cursor = n;
  }
  return true;
}

/* ひとつ前の選択の直前に戻る（パラメータも元に戻る） */
function goBack(s) {
  if (!s.history.length) return null;
  var history = s.history.slice(0, -1);
  var prev = JSON.parse(s.history[s.history.length - 1]);
  prev.history = history;
  return prev;
}

function progress(s) {
  if (s.screen === 'ending' || s.screen === 'result') return 100;
  var done = s.history.length;
  var remaining = s.pending ? 0 : 1;
  for (var i = s.cursor + 1; i < EVENTS.length; i++) {
    if (isActive(EVENTS[i], s, 'dh')) remaining++;
  }
  return Math.round(done / (done + remaining) * 100);
}

/* =========================================================
   診断
   ========================================================= */
function normParams(s) {
  var n = {};
  PARAMS.forEach(function (p) { n[p.key] = Math.max(0, s.params[p.key]) / PARAM_BASE[p.key]; });
  return n;
}

function paramLabel(k) {
  for (var i = 0; i < PARAMS.length; i++) if (PARAMS[i].key === k) return PARAMS[i].label;
  return k;
}

function topContrib(s, k, n) {
  return (s.contrib[k] || []).slice().sort(function (a, b) { return b.v - a.v || a.age - b.age; }).slice(0, n);
}

function diagnose(s) {
  var n = normParams(s);
  var scored = WORK_TYPES.map(function (t) {
    var sc = n[t.key];
    Object.keys(t.sub).forEach(function (k) { sc += n[k] * t.sub[k]; });
    return { type: t, score: sc };
  }).sort(function (a, b) { return b.score - a.score; });

  var main = scored[0].type;
  var sub = scored[1].type;

  var ranked = PARAMS.map(function (p) { return { key: p.key, label: p.label, n: n[p.key] }; })
    .sort(function (a, b) { return b.n - a.n; });
  /* 一番強い傾向を100、一番控えめな傾向を20として表示（違いを見やすくする） */
  var maxN = ranked[0].n, minN = ranked[ranked.length - 1].n;
  var radar = PARAMS.map(function (p) {
    var v = maxN > minN ? 20 + 80 * (n[p.key] - minN) / (maxN - minN) : 60;
    return { key: p.key, label: p.label, value: Math.round(v) };
  });

  var tendencies = ranked.slice(0, 3).map(function (r) {
    return { key: r.key, label: r.label, choices: topContrib(s, r.key, 2).map(function (c) { return c.label; }) };
  });

  return {
    main: main,
    sub: sub,
    reasons: topContrib(s, main.key, 3),
    subReasons: topContrib(s, sub.key, 1),
    tendencies: tendencies,
    growth: ranked[ranked.length - 1],
    radar: radar,
    norm: n
  };
}

/* =========================================================
   おすすめ医院のマッチング
   プレイヤーの「傾向（8パラメータ）」「職場への希望」「興味のある分野」と、
   医院の特徴を同じ形のベクトルにして、似ている度合い（コサイン類似度）で判定します。
   ========================================================= */
function playerVector(s) {
  var v = {};
  var n = normParams(s);
  var keys = Object.keys(n);
  var mean = keys.reduce(function (a, k) { return a + n[k]; }, 0) / keys.length;
  /* 自分の中で平均より強い傾向だけを使う（全員が同じ医院にならないように） */
  var dev = {}, sum = 0;
  keys.forEach(function (k) { dev[k] = Math.max(0, n[k] - mean * 0.85); sum += dev[k]; });
  keys.forEach(function (k) { if (sum > 0) v['p:' + k] = dev[k] / sum * 1.2; });

  var psum = 0;
  Object.keys(s.prefs).forEach(function (k) { psum += s.prefs[k]; });
  Object.keys(s.prefs).forEach(function (k) { v['f:' + k] = s.prefs[k] / psum * 1.0; });

  var tsum = 0;
  Object.keys(s.tags).forEach(function (k) { tsum += s.tags[k]; });
  Object.keys(s.tags).forEach(function (k) { v['t:' + k] = s.tags[k] / tsum * 0.5; });
  return v;
}

function clinicVector(c) {
  var v = {};
  var wsum = 0, psum = 0;
  Object.keys(c.w).forEach(function (k) { wsum += c.w[k]; });
  Object.keys(c.pw).forEach(function (k) { psum += c.pw[k]; });
  Object.keys(c.w).forEach(function (k) { v['p:' + k] = c.w[k] / wsum * 1.2; });
  Object.keys(c.pw).forEach(function (k) { v['f:' + k] = c.pw[k] / psum * 1.0; });
  c.tags.forEach(function (t) { v['t:' + t] = 0.5 / c.tags.length; });
  return v;
}

function cosine(a, b) {
  var dot = 0, na = 0, nb = 0;
  Object.keys(a).forEach(function (k) { na += a[k] * a[k]; if (b[k]) dot += a[k] * b[k]; });
  Object.keys(b).forEach(function (k) { nb += b[k] * b[k]; });
  if (!na || !nb) return 0;
  return dot / Math.sqrt(na * nb);
}

/* かぎかっこの中にかぎかっこがある場合は『』でくくる */
function q(t) { return String(t).indexOf('「') >= 0 ? '『' + t + '』' : '「' + t + '」'; }

function describePlayerSide(s, key) {
  var kind = key.slice(0, 1), k = key.slice(2);
  if (kind === 'p') {
    var c = topContrib(s, k, 1)[0];
    return { title: paramLabel(k) + 'が高い', phrase: '「' + paramLabel(k) + '」の傾向が強い', from: c ? c.label : '' };
  }
  if (kind === 'f') {
    return { title: '「' + PREFS[k] + '」を重視', phrase: '職場選びで「' + PREFS[k] + '」を重視している', from: (s.prefSrc[k] || [])[0] || '' };
  }
  return { title: '「' + TAGS[k] + '」に興味', phrase: '「' + TAGS[k] + '」の分野に興味がある', from: (s.prefSrc['tag:' + k] || [])[0] || '' };
}

function matchClinics(s) {
  var pv = playerVector(s);
  /* 診断された仕事タイプを特に重視する医院には、少しだけ加点（診断とおすすめの整合性を高める） */
  var d = diagnose(s);
  var career = s.career || 'dh';
  var list = CLINICS.filter(function (c) { return c.roles.indexOf(career) >= 0; }).map(function (c) {
    var cv = clinicVector(c);
    var cos = cosine(pv, cv);
    if ((c.w[d.main.key] || 0) >= 3) cos += 0.06;
    if ((c.w[d.sub.key] || 0) >= 3) cos += 0.03;
    var parts = Object.keys(cv).filter(function (k) { return pv[k] > 0 && c.match[k.slice(2)]; })
      .map(function (k) { return { key: k, v: pv[k] * cv[k] }; })
      .sort(function (a, b) { return b.v - a.v; })
      .slice(0, 3)
      .map(function (p) {
        var side = describePlayerSide(s, p.key);
        return { player: side.title, phrase: side.phrase, from: side.from, clinic: c.match[p.key.slice(2)] };
      });
    var pct = Math.max(50, Math.min(98, Math.round(52 + cos * 46)));
    return { clinic: c, cos: cos, pct: pct, points: parts };
  }).sort(function (a, b) { return b.cos - a.cos; });

  /* 診断タイプを特に重視する医院が上位3件にない場合は、3位に入れる */
  var top = list.slice(0, 3);
  var fit = function (m) { return (m.clinic.w[d.main.key] || 0) >= 3; };
  if (!top.some(fit)) {
    var alt = list.filter(fit)[0];
    if (alt) top[2] = alt;
  }

  return top.map(function (m, i) {
    m.rank = i + 1;
    m.stars = m.pct >= 88 ? 5 : m.pct >= 80 ? 4 : m.pct >= 70 ? 3 : 2;
    m.reason = buildReason(s, m);
    return m;
  });
}

function buildReason(s, m) {
  var c = m.clinic;
  if (!m.points.length) {
    return c.name + 'は、' + c.catch + 'です。あなたのバランスのとれた選択と幅広く合いそうです。';
  }
  var p = m.points[0];
  var txt = 'あなたは' + (p.from ? q(p.from) + 'という選択から、' : '') + p.phrase + 'と考えられます。';
  txt += c.name + 'には「' + p.clinic + '」' + (m.points[1] ? 'ほか、「' + m.points[1].clinic + '」' : '') + 'という特徴があり、あなたの希望と重なる点が多い医院です。';
  return txt;
}

/* =========================================================
   エンディング用の文章
   ========================================================= */
function lifeTitle(s) {
  var f = s.flags, cname = CAREERS[s.career].name;
  if (s.career === 'da' && f.aimDH) return '歯科衛生士をめざして学ぶ30歳';
  if (f.loanRejected) {
    return { dh: '独立を夢見て働く歯科衛生士、30歳', dds: '開業資金を貯めながら働く歯科医師、30歳', dt: '独立を夢見て腕を磨く歯科技工士、30歳', da: '医院を支える受付のプロ、30歳' }[s.career];
  }
  if (f.independent) {
    return { dh: 'フリーランス歯科衛生士として活躍する30歳', dds: '開業をめざす歯科医師、30歳', dt: '自分の技工所を持つ歯科技工士、30歳', da: '新しい医院を立ち上げた30歳' }[s.career];
  }
  if (f.cert) {
    return { dh: '認定歯科衛生士として頼られる30歳', dds: '専門性を磨く歯科医師、30歳', dt: '腕を認められた歯科技工士、30歳', da: '医院の顔として信頼される30歳' }[s.career];
  }
  if (f.changedJob) return '自分に合う職場を見つけた' + cname + '、30歳';
  return '医院に欠かせない' + cname + '、30歳';
}

function endingStory(s) {
  var f = s.flags, c = CAREERS[s.career];
  var lines = [];
  var w = findWealth(s.life.wealth);
  lines.push(findOrigin(ORIGIN_TOWNS, s.life.town).text + 'の「' + w.label + '」に生まれて30年。あなたは30歳になりました。');
  if ((w.id === 'tight' || w.id === 'poor') && s.career !== 'da' && s.flags.passed) lines.push('家計が苦しい中、奨学金を借りて資格を手にしました。');
  if (w.id === 'dental') lines.push('実家の歯科医院のことも、いつも頭の片隅にありました。');
  if (s.career === 'da') {
    lines.push('高校卒業後すぐに' + c.name + 'として働き始め、「' + s.workplace + '」で社会人の一歩を踏み出しました。');
  } else {
    if (f.ronin) lines.push(f.switched ? '歯学部の入試に落ち、浪人生活の末に歯科衛生士へと進路を変えました。' : '入試では一度つまずき、1年間の浪人生活を経験しました。');
    lines.push(c.school + 'で学び、' + (f.failed2 ? '2度の不合格を乗り越えて' : f.failed ? '一度の不合格を乗り越えて' : '') + c.license + 'に合格。「' + s.workplace + '」で' + c.name + 'としての一歩を踏み出しました。');
  }
  if (f.rejected) lines.push('第一志望の職場には採用されず、悔しい思いもしました。');
  if (f.burnout) lines.push('無理を続けて体調を崩した時期もありましたが、そこから自分の働き方を見つめ直しました。');
  if (f.aimDH) lines.push('働きながら夜間部の養成校に通い、30歳の今、歯科衛生士国家試験への挑戦を目前にしています。');
  else if (f.cert) lines.push('仕事をしながら専門性を高める挑戦を続け、周りから頼られる存在になりました。');
  if (f.independent) lines.push('そして、自分の力で新しい道を切りひらく決断をしました。' + (s.career === 'dds' ? '数千万円の借入れを背負っての開業です。' : ''));
  else if (f.loanRejected) lines.push('独立の夢は資金不足で一度あきらめましたが、今も貯金を続けています。');
  else if (f.changedJob) lines.push('途中で職場を変えたことで、より自分らしく働ける環境に出会えました。');
  else if (f.stay) lines.push('同じ職場で経験を重ね、今ではチームに欠かせない存在です。');
  if (f.family) lines.push('プライベートでは大切な家族と、新しい暮らしを築いています。');
  lines.push('30歳の今、貯金は' + yen(s.money) + '、借金（奨学金・ローン）の残りは' + yen(s.debt) + '、年収は' + yen(s.income) + 'です。');
  lines.push('あなたの選択のひとつひとつが、今のあなたをつくりました。');
  return lines;
}

function lifeTimeline(s) {
  return s.log.filter(function (l) { return KEY_EVENTS.indexOf(l.id) >= 0; });
}

function careerPath(s) {
  var f = s.flags, c = CAREERS[s.career];
  var path = [{ age: 15, text: '高校入学' }, { age: 18, text: s.career === 'da' ? c.name + 'の道へ' : c.school + 'へ進学' }];
  var exam = s.log.filter(function (l) { return l.id === 'exam' || l.id === 'retake'; });
  if (exam.length) path.push({ age: exam[exam.length - 1].age, text: c.name + 'の免許を取得' });
  path.push({ age: jobAge(s), text: s.workplace + 'に就職' });
  var cert = s.log.filter(function (l) { return l.id === 'w_cert'; })[0];
  if (cert && (f.cert || f.aimDH)) path.push({ age: cert.age, text: cert.text });
  var ch = s.log.filter(function (l) { return l.id === 'w_change'; })[0];
  if (ch) path.push({ age: ch.age, text: ch.text });
  path.push({ age: 30, text: lifeTitle(s) });
  return path;
}
